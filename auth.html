<!DOCTYPE html>
<html lang="en" data-page="auth">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09040a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Kandy's Treats • Authentication</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="auth-page">

<div class="auth-card">

<img
src="logo.png"
class="auth-logo"
alt="Kandy's Treats">

<h1 id="auth-title">
Welcome Back
</h1>

<p id="auth-subtitle">
Sign in to continue ordering your favourite meals.
</p>

<!-- Tabs -->

<div class="auth-tabs">

<button
type="button"
id="login-tab"
class="auth-tab active">

Sign In

</button>

<button
type="button"
id="register-tab"
class="auth-tab">

Create Account

</button>

</div>

<!-- ================= LOGIN ================= -->

<form id="login-form">

<div class="input-group">

<label>Email Address</label>

<div class="input-box">

<input
type="email"
id="login-email"
placeholder="example@gmail.com"
required>

<img
src="icons/email.svg"
class="input-icon"
alt="">

</div>

</div>

<div class="input-group">

<label>Password</label>

<div class="input-box">

<input
type="password"
id="login-password"
placeholder="Enter your password"
required>

<button
type="button"
class="password-toggle">

<img
src="icons/eye.svg"
class="eye-icon"
alt="">

</button>

</div>

</div>

<div class="auth-extra">

<a href="#" id="forgot-password">

Forgot Password?

</a>

</div>

<button
id="login-btn"
class="btn-primary"
type="submit">

Sign In

</button>

<div class="divider">

<span>OR</span>

</div>

<!-- Login -->
<button
type="button"
id="google-login-btn"
class="google-btn">

<img
src="icons/Google.svg"
alt="Google">

Continue with Google

</button>

</form>

<!-- ================= REGISTER ================= -->

<form
id="register-form"
class="hidden">

<div class="name-row">

<div class="input-group">

<label>First Name</label>

<div class="input-box">

<input
type="text"
id="first-name"
placeholder="John"
required>

<img
src="icons/user.svg"
class="input-icon"
alt="">

</div>

</div>

<div class="input-group">

<label>Last Name</label>

<div class="input-box">

<input
type="text"
id="last-name"
placeholder="Doe"
required>

<img
src="icons/user.svg"
class="input-icon"
alt="">

</div>

</div>

</div>

<div class="input-group">

<label>Email Address</label>

<div class="input-box">

<input
type="email"
id="register-email"
placeholder="example@gmail.com"
required>

<img
src="icons/email.svg"
class="input-icon"
alt="">

</div>

</div>

<div class="input-group">

<label>Phone Number</label>

<div class="input-box">

<input
type="tel"
id="register-phone"
placeholder="+234..."
required>

<img
src="icons/phone.svg"
class="input-icon"
alt="">

</div>

</div>

<div class="input-group">

<label>Password</label>

<div class="input-box">

<input
type="password"
id="register-password"
placeholder="Create password"
required>

<button
type="button"
class="password-toggle">

<img
src="icons/eye.svg"
class="eye-icon"
alt="">

</button>

</div>

</div>

<div class="input-group">

<label>Confirm Password</label>

<div class="input-box">

<input
type="password"
id="confirm-password"
placeholder="Confirm password"
required>

<button
type="button"
class="password-toggle">

<img
src="icons/eye.svg"
class="eye-icon"
alt="">

</button>

</div>

</div>

<button id="register-btn"
class="btn-primary"
type="submit">

Create Account

</button>

<div class="divider">

<span>OR</span>

</div>

<!-- Register -->
<button
type="button"
id="google-register-btn"
class="google-btn">

<img
src="icons/Google.svg"
alt="Google">

Continue with Google

</button>

</form>

</div>

</div>

<!-- Toast Notification -->
<div id="toast"></div>
<script type="module" src="js/auth.js"></script>

</body>

</html>

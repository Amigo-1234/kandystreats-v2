<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kandy's Treats • Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/profile.css">

</head>

<body>

<main class="profile-page">

    <!-- Announcement -->
    <section class="announcement-bar">

        <p>

            PROFILE • WELCOME BACK • KANDY'S TREATS • PREMIUM EXPERIENCE

        </p> 

    </section>

    <!-- Header -->

    <section class="profile-header">

        <p class="page-greeting">

            Good Evening 👋

        </p>

        <h1>

            Welcome back,
            <span id="profile-name">
                Loading...
            </span>

        </h1>

        <p class="page-subtitle">

            Manage your Kandy's Treats account.

        </p>

    </section>

    <!-- Hero Card -->

    <section class="glass-card profile-hero">

        <div class="avatar-wrapper">

            <img
            id="profile-avatar"
            src="images/default-avatar.png"
            alt="Profile">

            <button class="camera-btn">

                <img
                src="icons/camera.svg"
                alt="">

            </button>

        </div>

        <div class="hero-content">

            <h2 id="profile-fullname">

                Loading...

            </h2>

            <div class="verified-row">

                <img
                src="icons/verified.svg"
                alt="">

                <span>

                    Verified Customer

                </span>

            </div>

            <div class="membership-pill">

                <span id="membership">

                    Classic Member

                </span>

            </div>

            <button class="edit-profile-btn">

    <img src="icons/edit.svg" alt="">

    <span>Edit Profile</span>

</button>

        </div>

    </section>

    <!-- ===========================
     ACCOUNT
============================ -->

<section class="account-section">

    <h3 class="section-title">
        Account
    </h3>

    <div class="account-list">

        <a href="orders.html" class="glass-card account-item">

            <div class="account-left">

                <div class="account-icon orders-icon">
                    <img src="icons/orders.svg" alt="Orders">
                </div>

                <span>My Orders</span>

            </div>

            <img src="icons/chevron-right.svg"
                 class="account-arrow"
                 alt="">

        </a>


        <a href="favorites.html" class="glass-card account-item">

            <div class="account-left">

                <div class="account-icon favorite-icon">
                    <img src="icons/favorite.svg" alt="Favorites">
                </div>

                <span>Favorites</span>

            </div>

            <img src="icons/chevron-right.svg"
                 class="account-arrow"
                 alt="">

        </a>


        <a href="addresses.html" class="glass-card account-item">

            <div class="account-left">

                <div class="account-icon location-icon">
                    <img src="icons/location.svg" alt="Location">
                </div>

                <span>Saved Addresses</span>

            </div>

            <img src="icons/chevron-right.svg"
                 class="account-arrow"
                 alt="">

        </a>


        <a href="payment.html" class="glass-card account-item">

            <div class="account-left">

                <div class="account-icon wallet-icon">
                    <img src="icons/wallet.svg" alt="Wallet">
                </div>

                <span>Payment Methods</span>

            </div>

            <img src="icons/chevron-right.svg"
                 class="account-arrow"
                 alt="">

        </a>


        <a href="settings.html" class="glass-card account-item">

            <div class="account-left">

                <div class="account-icon settings-icon">
                    <img src="icons/settings.svg" alt="Settings">
                </div>

                <span>Settings</span>

            </div>

            <img src="icons/chevron-right.svg"
                 class="account-arrow"
                 alt="">

        </a>


        <button id="logout-btn"
                class="glass-card account-item logout-item">

            <div class="account-left">

                <div class="account-icon logout-icon">
                    <img src="icons/log-out.svg" alt="Logout">
                </div>

                <span>Logout</span>

            </div>

            <img src="icons/chevron-right.svg"
                 class="account-arrow"
                 alt="">

        </button>

    </div>

</section>

</main>

<script
type="module"
src="js/profile.js">
</script>

</body>

</html>

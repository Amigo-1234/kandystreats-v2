<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kandy's Treats • Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/profile.css">

</head>

<body>

<main class="profile-page">

    <!-- Announcement -->
    <section class="announcement-bar">

        <p>

            PROFILE • WELCOME BACK • KANDY'S TREATS • PREMIUM EXPERIENCE

        </p> 

    </section>

    <!-- Header -->

    <section class="profile-header">

        <p class="page-greeting">

            Good Evening 👋

        </p>

        <h1>

            Welcome back,
            <span id="profile-name">
                Loading...
            </span>

        </h1>

        <p class="page-subtitle">

            Manage your Kandy's Treats account.

        </p>

    </section>

    <!-- Hero Card -->

    <section class="glass-card profile-hero">

        <div class="avatar-wrapper">

            <img
            id="profile-avatar"
            src="images/default-avatar.png"
            alt="Profile">

            <button class="camera-btn">

                <img
                src="icons/camera.svg"
                alt="">

            </button>

        </div>

        <div class="hero-content">

            <h2 id="profile-fullname">

                Loading...

            </h2>

            <div class="verified-row">

                <img
                src="icons/verified.svg"
                alt="">

                <span>

                    Verified Customer

                </span>

            </div>

            <div class="membership-pill">

                <span id="membership">

                    Classic Member

                </span>

            </div>

            <button
            class="btn-primary">

                Edit Profile

            </button>

        </div>

    </section>

</main>

<script
type="module"
src="js/profile.js">
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en" data-page="preview">
<head>
  <meta charset="UTF-8" />
  <title>Review Orders | Kandys Treats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e84c88">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body class="page page-preview">

<div id="announcement-bar" class="top-announcement">
  <div class="announcement-viewport">
    <div class="announcement-track">
    <span class="announcement-content">Welcome to Kandys Treats 🍭</span>
    <span class="announcement-content">Welcome to Kandys Treats 🍭</span>
  </div>
  </div>
  </div>

  <main class="preview-shell">

    <header class="preview-header">
      <h1>Review your orders</h1>
      <p>You can combine multiple orders and pay once.</p>
    </header>

    <nav class="checkout-progress" aria-label="Checkout progress">
      <span class="is-complete">Cart</span>
      <span class="is-active">Review</span>
      <span>Payment</span>
      <span>Track</span>
    </nav>

    <section id="draft-orders" class="draft-orders"></section>

    <p id="no-drafts" class="empty-state" hidden>
      No saved orders yet.
    </p>

    <section class="preview-summary">
      <div class="summary-row">
        <span>Total to pay</span>
        <strong id="preview-total">₦0</strong>
      </div>

      <button
        id="proceed-payment"
        class="btn btn-primary btn-block">
        Proceed to payment
      </button>

      <button
        id="pay-wallet"
        class="btn btn-outline btn-block"
        type="button">
        Pay with wallet
      </button>

      <a href="cart.html" class="btn btn-outline btn-block">
        Add more orders
      </a>
    </section>

  </main>

  <nav class="bottom-nav glass-card">
    <a href="home.html" class="bottom-nav-item" data-page="home">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
      <span class="nav-label">Home</span>
    </a>
    <a href="menu.html" class="bottom-nav-item" data-page="menu">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="nav-label">Menu</span>
    </a>
    <a href="cart.html" class="bottom-nav-item" data-page="cart">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 6h15l-2 9H7z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <span class="nav-label">Cart</span>
      <span class="bottom-nav-badge js-cart-count">0</span>
    </a>
    <a href="track.html" class="bottom-nav-item" data-page="track">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 21s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10z"/><circle cx="12" cy="11" r="2.5"/></svg>
      <span class="nav-label">Track</span>
    </a>
  </nav>

  <script src="app.js" type="module"></script>
  <script src="js/customer-nav.js" type="module"></script>
  <div class="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>

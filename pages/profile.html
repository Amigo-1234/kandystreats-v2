<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Kandy's Treats</title>

    <link rel="stylesheet" href="../css/profile.css">
</head>

<body>

<div class="profile-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="profile-header">

    <button class="edit-profile">

        <img src="../icons/edit.svg" class="edit-icon" alt="">

        Edit Profile

    </button>

    <h2 class="page-title">

        Profile

    </h2>

    <div class="profile-card">

        <div class="profile-left">

            <div class="avatar-wrapper">

                <img
                    src="../images/default-avatar.png"
                    class="profile-avatar"
                    id="profile-photo"
                    alt="Profile">

                <span class="online-badge"></span>

            </div>

        </div>

        <div class="profile-right">

            <h1 id="profile-name">

                Idris Muftau

            </h1>

            <div class="member-level">

                👑 Gold Member

            </div>

            <div class="profile-status">

    <img
        src="../icons/verified.svg"
        class="status-icon"
        alt="">

    <span>

        Verified Customer

    </span>

</div>

        </div>

    </div>

    <div class="stats-bar">

        <div class="stat-item">

            <img src="../icons/bag.svg"
                 class="stat-icon"
                 alt="">

            <div>

                <h3 id="orders-count">0</h3>

                <span>Orders</span>

            </div>

        </div>

        <div class="divider"></div>

        <div class="stat-item">

            <img src="../icons/heart.svg"
                 class="stat-icon"
                 alt="">

            <div>

                <h3 id="favorites-count">0</h3>

                <span>Favorites</span>

            </div>

        </div>

        <div class="divider"></div>

        <div class="stat-item">

            <img src="../icons/gift.svg"
                 class="stat-icon"
                 alt="">

            <div>

                <h3 id="reward-count">0</h3>

                <span>Rewards</span>

            </div>

        </div>

    </div>

</header>

    <!-- =========================
         PERSONAL
    ========================== -->

    <section class="menu-section">

        <h3>
            Personal
        </h3>

        <div class="menu-card">

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img
                        src="../icons/account.svg"
                        alt=""
                        class="menu-icon">

                    <span>
                        My Account
                    </span>

                </div>

                <img
                    src="../icons/chevron-right.svg"
                    alt=""
                    class="chevron">

            </a>

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img
                        src="../icons/location.svg"
                        alt=""
                        class="menu-icon">

                    <span>
                        Delivery Addresses
                    </span>

                </div>

                <img
                    src="../icons/chevron-right.svg"
                    alt=""
                    class="chevron">

            </a>

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img
                        src="../icons/heart.svg"
                        alt=""
                        class="menu-icon">

                    <span>
                        Favorites
                    </span>

                </div>

                <img
                    src="../icons/chevron-right.svg"
                    alt=""
                    class="chevron">

            </a>

        </div>

    </section>

    <!-- =========================
         ORDERS
    ========================== -->

    <section class="menu-section">

        <h3>Orders</h3>

        <div class="menu-card">

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img src="../icons/bag.svg"
                         class="menu-icon"
                         alt="">

                    <span>Active Orders</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img src="../icons/history.svg"
                         class="menu-icon"
                         alt="">

                    <span>Order History</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img src="../icons/gift.svg"
                         class="menu-icon"
                         alt="">

                    <span>Rewards</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

        </div>

    </section>

    <!-- =========================
         SUPPORT
    ========================== -->

    <section class="menu-section">

        <h3>Support</h3>

        <div class="menu-card">

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img src="../icons/notification.svg"
                         class="menu-icon"
                         alt="">

                    <span>Notifications</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img src="../icons/support.svg"
                         class="menu-icon"
                         alt="">

                    <span>Contact Support</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

            <a href="#" class="menu-item">

                <div class="menu-left">

                    <img src="../icons/faq.svg"
                         class="menu-icon"
                         alt="">

                    <span>FAQs</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

        </div>

    </section>

    <!-- =========================
         SETTINGS
    ========================== -->

    <section class="menu-section">

        <h3>Settings</h3>

        <div class="menu-card">

            <a href="#" class="menu-item logout">

                <div class="menu-left">

                    <img src="../icons/log-out.svg"
                         class="menu-icon"
                         alt="">

                    <span>Logout</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

            <a href="#" class="menu-item delete-account">

                <div class="menu-left">

                    <img src="../icons/account.svg"
                         class="menu-icon"
                         alt="">

                    <span>Delete Account</span>

                </div>

                <img src="../icons/chevron-right.svg"
                     class="chevron"
                     alt="">

            </a>

        </div>

    </section>

</div>

<script src="../js/profile.js"></script>

</body>
</html>

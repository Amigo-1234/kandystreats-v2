<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#FF6B6B">

    <title>Kandy's Treats | Profile</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/profile.css">

</head>

<body>

    <main class="profile-page">

        <section class="profile-header">

            <div class="top-bar">

                <h2>Profile</h2>

            </div>

            <div class="profile-avatar">

                <img
                    id="profile-photo"
                    src="../images/default-avatar.png"
                    alt="Profile">

                <span class="verified-badge">

                    ✓

                </span>

            </div>

            <h1 id="profile-name">

                Loading...

            </h1>

            <p class="profile-status">

                Verified Customer

            </p>

        </section>

        <section class="stats-container">

            <div class="stat-card">

                <h3>0</h3>

                <p>Orders</p>

            </div>

            <div class="stat-card">

                <h3>0</h3>

                <p>Favorites</p>

            </div>

            <div class="stat-card">

                <h3>0</h3>

                <p>Rewards</p>

            </div>

        </section>

    </main>

    <script
        type="module"
        src="../js/profile.js"></script>

</body>

</html>
